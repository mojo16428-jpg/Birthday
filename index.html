
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Lakshya ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
}

.container {
    background: rgba(255,255,255,0.9);
    padding: 40px 25px;
    border-radius: 25px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    z-index: 2;
    animation: appear 1.5s ease;
}

h1 {
    color: #ff4081;
    font-size: 32px;
    margin-bottom: 20px;
}

.cake {
    font-size: 75px;
    margin: 20px;
    animation: bounce 2s infinite;
}

.message {
    font-size: 18px;
    color: #555;
    line-height: 1.7;
    margin: 20px 0;
}

button {
    background: #ff4081;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e91e63;
    transform: scale(1.05);
}

.heart {
    position: absolute;
    bottom: -30px;
    font-size: 25px;
    animation: float 7s linear infinite;
    opacity: 0.8;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes bounce {
    50% { transform: translateY(-12px); }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

#surprise {
    display: none;
    color: #ff4081;
    font-size: 20px;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎉 Happy Birthday Lakshya! 🎉</h1>

    <div class="cake">🎂</div>

    <p class="message">
        Happy Birthday, Lakshya! ❤️
        <br><br>
        May your life always be filled with
        happiness, laughter, success and beautiful
        memories.
        <br><br>
        Keep smiling and enjoy your special day.
        Stay blessed! 🥳
    </p>

    <button onclick="showSurprise()">
        Click for a Surprise ❤️
    </button>

    <div id="surprise">
        You are special! Have the best birthday ever! 💖
    </div>

    <p style="margin-top:25px;color:#888;">
        — From Me ❤️
    </p>

</div>

<script>
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = ["❤️", "💖", "💕", "🎈"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random()*4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
